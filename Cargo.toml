[package]
name = "tutorlolv2_web"
version = "0.2.1"
edition = "2024"
authors = ["Luiz Gustavo Santana Dias Gomes"]
repository = "https://github.com/LuizGomes56/tutorlolv2_web"

[dependencies]
base64 = "0.23.1"
bincode = "2.0.1"
derive_more = { version = "2.1.1", features = ["full"] }
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
pastey = "0.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
tutorlolv2 = { path = "../tutorlolv2", features = ["yew"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
yew = { version = "0.22.0", features = ["csr"] }
yew-router = "0.19.0"

# This crate is its own workspace root, so the profile in `tutorlolv2` doesn't apply here.
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
