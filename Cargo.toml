[package]
name = "tutorlolv2_web"
version = "0.2.2"
edition = "2024"
repository = "https://github.com/LuizGomes56/tutorlolv2_web"

[dependencies]
base64 = "0.23.1"
bincode = "2.0.1"
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
implicit-clone = "0.6.0"
pastey = "0.2.3"
serde_json = { version = "1.0", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
tutorlolv2 = { path = "../tutorlolv2", default-features = false, features = ["client"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Headers", "Request", "RequestInit", "Response", "Window"] }
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"

[features]
default = ["local-calculation", "tauri"]
local-calculation = ["tutorlolv2/engine"]
tauri = ["dep:serde_json"]

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
