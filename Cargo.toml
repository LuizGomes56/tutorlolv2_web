[package]
name = "tutorlolv2_web"
version = "0.1.0"
edition = "2024"

[dependencies]
brotli = "8.0.2"
getrandom = {
  version = "0.4.2",
  default-features = false,
  features = [
    "wasm_js",
  ]
}
pastey = "0.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tutorlolv2 = { path = "../tutorlolv2" }
wasm-bindgen = "0.2.101"
wasm-bindgen-futures = "0.4.54"
web-sys = "0.3.78"
yew = { version = "0.22.0", features = ["csr"] }
yew-router = "0.19.0"
