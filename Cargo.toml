[package]
name = "tutorlolv2_web"
version = "0.1.0"
edition = "2024"

[dependencies]
tutorlolv2_gen = { path = "../tutorlolv2/tutorlolv2_gen" }
bincode = "2.0.1"
web-sys = { version = "0.3.78", features = ["AbortController"] }
wasm-bindgen = "0.2.101"
gloo-net = { version = "0.6.0", default-features = false, features = ["http"] }
wasm-bindgen-futures = "0.4.54"
pastey = "0.2.1"
yew = { version = "0.22.0", features = ["csr"] }
brotli = "8.0.2"
yew-router = "0.19.0"
getrandom = { version = "0.4.2", default-features = false, features = [
    "wasm_js",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tutorlolv2 = { path = "../tutorlolv2", optional = true }

[features]
# default = []
default = ["server"]
server = ["dep:tutorlolv2"]
