[package]
name = "tutorlolv2_web"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "2.0.1"
derive_more = { version = "2.1.1", features = ["full"] }
getrandom = { version = "0.4.2", default-features = false, features = ["wasm_js"] }
gloo-net = { version = "0.6.0", default-features = false, features = ["http"] }
pastey = "0.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
tutorlolv2 = { path = "../tutorlolv2", features = ["yew"] }
wasm-bindgen = "0.2.101"
wasm-bindgen-futures = "0.4.54"
web-sys = { version = "0.3.78", features = ["AbortController"] }
yew = { version = "0.22.0", features = ["csr"] }
yew-router = "0.19.0"
